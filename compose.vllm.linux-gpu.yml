services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: vllm
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen3-Coder-30B-A3B-Instruct}"
      - "--api-key"
      - "${VLLM_API_KEY:-dev}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
    environment:
      HF_TOKEN: "${HF_TOKEN:?Set HF_TOKEN}"
    ports:
      - "8000:8000"
    volumes:
      - "${HF_CACHE_DIR:?Set HF_CACHE_DIR}:/root/.cache/huggingface"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
